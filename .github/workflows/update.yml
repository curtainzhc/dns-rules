name: 自动更新规则

# 每 6 小时自动跑一次（UTC 时间：0,6,12,18 点整）
# 也支持在 Actions 页面手动点 Run workflow 立即更新
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 允许脚本把更新后的规则提交回仓库
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取原项目并合并去重
        run: python3 update_rules.py

      - name: 提交更新（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rules.txt data/allow.txt data/meta.json
          if git diff --cached --quiet; then
            echo "规则无变化，跳过提交"
          else
            git commit -m "自动更新规则 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "规则已更新并提交"
          fi

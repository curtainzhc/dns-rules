name: 自动更新规则

# 每 6 小时两次触发机会（UTC 第 13/43 分，错开整点防 GitHub 高负载丢弃）
# 另有 watchdog.yml 每 2 小时看门，超时未更新会自动补跑
# 也支持在 Actions 页面手动点 Run workflow 立即更新
on:
  schedule:
    - cron: '13 */6 * * *'
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 主更新与看门狗共用一组，避免同时改文件互相冲突
concurrency:
  group: rules-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取原项目并合并去重（失败自动重试2次）
        run: |
          for i in 1 2 3; do
            echo "===== 第 $i 次尝试 ====="
            if python3 update_rules.py; then
              echo "更新成功"
              exit 0
            fi
            echo "第 $i 次失败，30 秒后重试"
            sleep 30
          done
          echo "3 次均失败" >&2
          exit 1
        env:
          WRITE_AUTOLOG: '1'

      - name: 提交小文件（白名单/元数据/更新日志）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/allow.txt data/meta.json data/change.json AUTOLOG.md
          if git diff --cached --quiet; then
            echo "小文件无变化，跳过提交"
          else
            git commit -m "自动更新规则 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "小文件已更新并提交"
          fi

      - name: 上传全量与精简版到 Release（超 Git 单文件限制）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: full-rules
          name: 规则全集（全量1159万 + 精简版750万）
          body: |
            全量 rules.txt（1159万条）与精简版 rules-lite.txt（750万条）均超 Git 100MB 单文件限制，故走 Release。
            项目与服务器统一使用精简版 750 万条，订阅地址见 README。
          files: |
            data/rules.txt
            data/rules-lite.txt
          keep_standard: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送750万规则到服务器（直连，绕开代理）
        if: success()
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "=== 准备 SSH 密钥 ==="
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${SERVER_USER}@${SERVER_IP}"

          echo "=== 推送 meta 与规则文件（直连 scp） ==="
          TS=$(python3 -c "import json;print(json.load(open('data/meta.json'))['updated_ts'])")
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            data/meta.json ${SERVER_USER}@${SERVER_IP}:/tmp/push_meta.json
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=900 \
            data/rules-lite.txt ${SERVER_USER}@${SERVER_IP}:/tmp/push_rules-lite.txt
          echo "文件已推送 (ts=$TS)"

          echo "=== 触发服务器接收脚本（校验+替换订阅源+热刷新验证+回滚，零中断不重启） ==="
          $SSH 'sudo /opt/luckdns-site/push-receive.sh /tmp/push_rules-lite.txt'
          echo "=== 服务器同步完成 ==="
